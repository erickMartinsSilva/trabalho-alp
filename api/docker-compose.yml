version: '3.8'

services:
  api1:
    build: .
    container_name: alp-api-1
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/app.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  api2:
    build: .
    container_name: alp-api-2
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/app.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  api3:
    build: .
    container_name: alp-api-3
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/app.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data: